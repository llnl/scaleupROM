# Re = 1e5 counterpart of openlb_examples/corner2d_turbulent.cpp.
#
# Elbow: inlet [0,1]x[4,5] -> chamber [1,6]x[0,5] -> outlet [6,11]x[0,1].
# Mesh h = 1/16 -> velocity-node spacing h_eff = h/2 = 1/32, matching that run's
# physDeltaX = 1/N = 1/30. The coarser mesh at the *higher* Reynolds number is
# deliberate and mirrors OpenLB; see README.md.
#
# There is no turbulence model here. As in the OpenLB run (whose lattice
# viscosity is 6e-6, i.e. essentially zero), this is an under-resolved
# calculation held together by numerical dissipation -- the interior
# Lax-Friedrichs flux plays the role of OpenLB's Smagorinsky term. Expect
# qualitative agreement, not pointwise.
#
# NOTE ON THE INITIAL CONDITION. backward_facing_step's IC is not consistent
# with this geometry: it lays a jet across x in [0,6] at y in [4,5] that runs
# into step2's face at x = 6. That impulsive stop is the riskiest moment of this
# run -- if the early CFL spikes, switch to channel_flow, which starts from rest
# (and is what OpenLB does) -- change BOTH:
#   parameterized_problem/name -> channel_flow
#   mesh/filename              -> meshes/corner2d.h0.0625.chan.msh.mfem
# or just:  ./run_production.sh corner2d.Re1e5 --problem channel_flow

main:
  mode: single_run
  use_rom: false
  solver: unsteady-ns

mesh:
  type: submesh
  filename: meshes/corner2d.h0.0625.bfs.msh.mfem   # .bfs tags: 1=inflow 2=wall 3=outflow
  uniform_refinement: 0

domain-decomposition:
  type: none          # monolithic FOM: one mesh, one subdomain

discretization:
  order: 1            # Q2 velocity / Q1 pressure
  # Required here: this puts the Lax-Friedrichs flux on interior faces, which is
  # the only stabilization in the scheme at this Reynolds number. Do not disable.
  full-discrete-galerkin: true

navier-stokes:
  operator-type: lf   # UnsteadyNSSolver only supports the Lax-Friedrichs flux
  zeta: 1.0

stokes:
  nu: 1.0e-5          # overwritten by the single_run value below; kept in sync

solver:
  direct_solve: true
  use_restart: false

time-integration:
  # Nominal CFL limit on this mesh is 2.5e-3 at u_max = 2.5; halved for margin,
  # as in bump2d.Re1e5. If it runs stably, 2.0e-3 halves the wall time.
  timestep_size: 1.0e-3   # CFL ~ 0.08
  number_of_timesteps: 100000   # 100 physical time = OpenLB maxPhysT
  bdf_order: 1
  report_interval: 100

visualization:
  enabled: true
  unified_paraview: true
  time_interval: 200      # every 0.2 physical time, as OpenLB writes its vtm files
  file_path:
    directory: paraview
    prefix: corner2d_Re1e5

save_solution:
  enabled: true
  restart_interval: 1000  # every 1.0 physical time, as OpenLB checkpoints
  file_path:
    directory: restart
    prefix: corner2d_Re1e5

parameterized_problem:
  name: backward_facing_step

# Only the block named by parameterized_problem/name is read, so both can live
# here (same pattern as examples/stokes/array.8.yml).
single_run:
  backward_facing_step:
    nu: 1.0e-5    # Re = charL * charU / nu = 1 * 1 / 1e-5 = 1e5
    y0: 4.0       # inlet duct spans y in [4, 5]
    y1: 5.0
    u0: 1.5       # Poiseuille peak -> mean 1.0 = OpenLB charPhysVelocity
    # Transverse inlet perturbation, off by default. Try amp0: 0.01, ky0: 1.0,
    # freq0: 0.5 to trip the flow if it does not become unsteady on its own.
    amp0: 0.0
    ky0: 0.0
    freq0: 0.0
    t_offset0: 0.0
  channel_flow:
    # Same Poiseuille inflow as above, reparameterized; the difference is that
    # ChannelFlow sets no ic_ptr, so UnsteadyNSSolver starts from rest. Note it
    # has no perturbation knobs, so there is no way to trip the flow with it.
    nu: 1.0e-5
    L: 1.0        # duct height   = y1 - y0
    x0: 4.5       # duct centre   = (y0 + y1) / 2
    U: 1.5        # peak velocity = u0
